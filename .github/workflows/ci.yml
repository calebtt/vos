name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VOS_GITLEAKS: required
      VOS_REQUIRE_SIGNED_RELEASE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
        with:
          validate-wrappers: true

      - name: Shell scripts (image builder, key script, CI helpers)
        run: shellcheck -S warning image/*.sh ci/*.sh

      - name: Install pinned gitleaks (sha256-verified)
        run: ci/fetch-gitleaks.sh

      - name: gitleaks over the full git history
        run: .tools/gitleaks git --no-banner --redact --exit-code 1 .

      - name: Throwaway release key (exercises release signing; never reused)
        run: ci/make-throwaway-release-key.sh "$RUNNER_TEMP/vos-ci-key" >> "$GITHUB_ENV"

      - name: Build, unit tests, lint, policy check and its negative tests
        run: ./gradlew --no-daemon check :actuator:assembleRelease :session:assembleRelease
